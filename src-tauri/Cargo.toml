[package]
name = "photo-annotator"
version = "0.1.0"
description = "사진 위에 화살표·네모·번호·코멘트를 달아 저장하는 도구"
edition = "2021"
rust-version = "1.77.2"
default-run = "PhotoAnnotator"

[lib]
name = "photo_annotator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Fixed binary name so the CI artifact is always PhotoAnnotator.exe.
[[bin]]
name = "PhotoAnnotator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
