name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    name: PhotoAnnotator.exe (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons from app-icon.svg
        run: npx tauri icon src-tauri/app-icon.svg --output src-tauri/icons

      - name: Build portable exe (no installer)
        run: npm run tauri build -- --no-bundle

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAnnotator-windows
          path: src-tauri/target/release/PhotoAnnotator.exe
          if-no-files-found: error
